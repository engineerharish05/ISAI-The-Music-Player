<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a09">
<meta name="description" content="ISAI — The Music Player">
<link rel="icon" type="image/jpeg" href="assets/isai-logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>ISAI — The Music Player</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" data-action="home"><span class="brand-mark"><img src="assets/isai-logo.jpg" alt="ISAI"></span><span><strong>ISAI</strong><small>THE MUSIC PLAYER</small></span></button>
    <div class="top-actions">
      <button class="round" data-action="search" aria-label="Search">⌕</button>
      <button class="round" data-action="toggle-theme" aria-label="Theme">◐</button>
    </div>
  </header>
  <main id="view"></main>
  <section id="miniPlayer" class="mini hidden">
    <button class="mini-cover" data-action="open-player">♫</button>
    <button class="mini-info" data-action="open-player"><b id="miniTitle">Nothing playing</b><span id="miniArtist">Choose a song</span></button>
    <button class="mini-btn" data-action="previous" aria-label="Previous track">‹</button>
    <button class="mini-main" id="miniPlay" data-action="play" aria-label="Play or pause">▶</button>
    <button class="mini-btn" data-action="next" aria-label="Next track">›</button>
  </section>
  <nav class="bottom" aria-label="Primary navigation">
    <button class="nav active" data-page="home"><i>⌂</i><span>Home</span></button>
    <button class="nav" data-page="explore"><i>⌕</i><span>Explore</span></button>
    <button class="nav" data-page="library"><i>♫</i><span>Library</span></button>
    <button class="nav" data-page="playlists"><i>▤</i><span>Playlists</span></button>
    <button class="nav" data-page="settings"><i>⚙</i><span>Settings</span></button>
  </nav>
</div>
<div id="toast"></div>
<input id="filePicker" type="file" accept="audio/*" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
<script src="final.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>

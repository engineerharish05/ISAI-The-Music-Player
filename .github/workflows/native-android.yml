name: Build ISAI Native Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

concurrency:
  group: isai-native-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: native-android
        run: gradle testDebugUnitTest

      - name: Lint
        working-directory: native-android
        run: gradle lintDebug

      - name: Build debug APK
        working-directory: native-android
        run: gradle assembleDebug

      - name: Build release APK
        working-directory: native-android
        run: gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-native-release-unsigned-apk
          path: native-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

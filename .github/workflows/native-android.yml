name: Build ISAI Native Android

on:
  workflow_dispatch:
  pull_request:
    paths: ["native-android/**", ".github/workflows/native-android.yml", "scripts/**"]
  push:
    branches: ["main", "claude/**"]
    paths: ["native-android/**", ".github/workflows/native-android.yml", "scripts/**"]

concurrency:
  group: isai-native-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native-android
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        id: unit
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain testDebugUnitTest 2>&1 | tee ../unit.log

      - name: Annotate unit test failures
        if: failure() && steps.unit.outcome == 'failure'
        working-directory: .
        run: scripts/ci-annotate.sh "unit tests" unit.log

      - name: Build debug APK
        id: debug
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee ../debug.log

      - name: Annotate debug build failures
        if: failure() && steps.debug.outcome == 'failure'
        working-directory: .
        run: scripts/ci-annotate.sh "assembleDebug" debug.log

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain lintIsaiDebug lintStreamDebug 2>&1 | tee ../lint.log

      - name: Annotate lint failures
        if: failure() && steps.lint.outcome == 'failure'
        working-directory: .
        run: scripts/ci-annotate.sh "lintDebug" lint.log

      - name: Build release APK (unsigned)
        id: release
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee ../release.log

      - name: Annotate release build failures
        if: failure() && steps.release.outcome == 'failure'
        working-directory: .
        run: scripts/ci-annotate.sh "assembleRelease" release.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: isai-debug-apks
          path: native-android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: isai-release-unsigned-apks
          path: native-android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isai-reports
          path: |
            native-android/app/build/reports/
            native-android/app/build/test-results/
            *.log
          if-no-files-found: ignore

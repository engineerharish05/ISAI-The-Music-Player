name: ISAI Native — Build & Verify

# Native-only verification pipeline.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - isai-architecture-blueprint
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify and build
        working-directory: native-android
        run: bash verify.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-release-unsigned-apk
          path: native-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

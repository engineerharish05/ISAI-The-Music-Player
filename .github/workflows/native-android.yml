name: Build ISAI Native Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build native debug APK
        working-directory: native-android
        run: gradle assembleDebug --stacktrace

      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

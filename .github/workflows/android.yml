name: Build ISAI Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Prepare web bundle
        run: |
          rm -rf www
          mkdir -p www/assets
          cp index.html style.css app.js www/
          cp assets/isai-logo.jpg www/assets/

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add native ISAI music bridge
        shell: bash
        run: |
          JAVA_DIR="android/app/src/main/java/com/rishinnovations/isai"
          mkdir -p "$JAVA_DIR"
          cp native/android/IsaiMediaStorePlugin.java "$JAVA_DIR/IsaiMediaStorePlugin.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/rishinnovations/isai/MainActivity.java")
          s = p.read_text()
          if "IsaiMediaStorePlugin" not in s:
              s = s.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;"
              )
              s = s.replace(
                  "public class MainActivity extends BridgeActivity {}",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(IsaiMediaStorePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }"""
              )
              s = s.replace(
                  "import android.os.Bundle;",
                  "import android.os.Bundle;\nimport com.rishinnovations.isai.IsaiMediaStorePlugin;"
              )
          p.write_text(s)
          PY

      - name: Add Android media permissions
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />'''
          if "android.permission.READ_MEDIA_AUDIO" not in s:
              s = s.replace(marker, marker + perms, 1)
          p.write_text(s)
          PY



      - name: Add ISAI foreground playback service
        shell: bash
        run: |
          JAVA_DIR="android/app/src/main/java/com/rishinnovations/isai"
          cat > "$JAVA_DIR/IsaiPlaybackService.java" <<'JAVA'
          package com.rishinnovations.isai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;

          public class IsaiPlaybackService extends Service {
              private static final String CHANNEL_ID = "isai_playback";
              private static final int NOTIFICATION_ID = 7301;

              @Override public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "ISAI playback", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Keeps ISAI audio playback active in the background");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);
                  builder.setSmallIcon(getApplicationInfo().icon)
                      .setContentTitle("ISAI")
                      .setContentText("Music playback active")
                      .setOngoing(true)
                      .setCategory(Notification.CATEGORY_TRANSPORT)
                      .setShowWhen(false);
                  startForeground(NOTIFICATION_ID, builder.build());
                  return START_NOT_STICKY;
              }

              @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVA
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='</application>'
          service='''\n        <service\n            android:name=".IsaiPlaybackService"\n            android:enabled="true"\n            android:exported="false"\n            android:foregroundServiceType="mediaPlayback" />\n'''
          if "IsaiPlaybackService" not in s:
              s=s.replace(marker,service+marker,1)
          p.write_text(s)
          PY
      - name: Verify playback service
        run: |
          test -f android/app/src/main/java/com/rishinnovations/isai/IsaiPlaybackService.java
          grep -q 'IsaiPlaybackService' android/app/src/main/AndroidManifest.xml
          grep -q 'startPlaybackService' android/app/src/main/java/com/rishinnovations/isai/IsaiMediaStorePlugin.java

      - name: Verify native bridge source
        run: |
          test -f android/app/src/main/java/com/rishinnovations/isai/IsaiMediaStorePlugin.java
          grep -q 'registerPlugin(IsaiMediaStorePlugin.class)' android/app/src/main/java/com/rishinnovations/isai/MainActivity.java

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: isai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: isai-android-project
          path: android/
          if-no-files-found: error

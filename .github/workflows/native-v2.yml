name: Build ISAI Native v2
on:
  workflow_dispatch:
  push:
    branches: ["native-v2"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: native-android
        run: gradle assembleDebug --stacktrace
      - name: Build release APK
        working-directory: native-android
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: isai-native-v2-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: isai-native-v2-release
          path: native-android/app/build/outputs/apk/release/app-release-unsigned.apk

# Build verification trigger
